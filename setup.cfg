[metadata]
name = credit-scoring
version = attr: credit_scoring.version.__version__
description = Credit scoring model (German Credit) with training, evaluation and inference CLI.
long_description = file: README.md
long_description_content_type = text/markdown
author = Alberto Viviani
author_email = mail.alberto.viviani@gmail.com
license = MIT
license_files = LICENSE
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Intended Audience :: Science/Research
    Topic :: Scientific/Engineering :: Artificial Intelligence

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True
install_requires =
    pandas==2.2.3
    numpy==1.26.4
    scikit-learn==1.5.2
    imbalanced-learn==0.12.4
    matplotlib==3.9.2
    seaborn==0.13.2
    joblib==1.4.2
    openml==0.14.2
    shap==0.46.0
    lightgbm==4.5.0
    pydantic==2.9.2
    packaging==24.2

[options.packages.find]
where = src
exclude =
    notebooks
    artifacts
    tests

[options.entry_points]
console_scripts =
    credit-train = credit_scoring.models.train:cli
    credit-eval = credit_scoring.models.evaluate:cli
    credit-infer = credit_scoring.models.infer:cli
    credit-summarize = credit_scoring.tools.summarize_predictions:cli

[tool:pytest]
addopts = -q

[flake8]
max-line-length = 120

